[settings]
idiomatic_version_file_enable_tools = ["node", "python", "rust"]
experimental = true

[tools]
node = "lts"
python = "3.12"
rust = "stable"
go = "1.24"
lua = "5.1"
pnpm = "latest"
kubie = "latest"
uv = "latest"
flux2 = "latest"
helm = "latest"
bun = "latest"
flyctl = "latest"
talosctl = "latest"
gh = "latest"
claude = "latest"
openbao = { version = "latest", exe = "bao" }
fnox = "latest"
age = "latest"

[env]
_.file = ".env"
